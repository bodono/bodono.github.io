name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate static site
        run: python scripts/check_site.py

      - name: Smoke-test Pages artifact upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. Re-enabling the workflow via the API resets that timer, so the
    # weekly run keeps itself alive without needing commits.
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/enable" \
            || echo "::warning::Could not re-enable workflow; it may be disabled after 60 days of inactivity."
