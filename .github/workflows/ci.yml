name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate static site
        run: python scripts/check_site.py

      - name: Smoke-test Pages artifact upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
